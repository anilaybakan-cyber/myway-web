<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyWay Travel Guide</title>
    <script>
        (function() {
            var pathParts = window.location.pathname.split("/").filter(Boolean);
            var filtered = pathParts.filter(function(p) {
                return p !== "guide" && p !== "guides" && p !== "index.html";
            });
            var params = new URLSearchParams(window.location.search);
            var cityId = (params.get("cityId") || filtered[filtered.length - 1] || "").toLowerCase();

            // 6-Language detection: en, tr, it, es, de, fr
            var userChoice = localStorage.getItem('myway_user_lang');
            var browserLang = (navigator.language || 'en').toLowerCase();
            var detected = userChoice;
            if (!detected) {
                if (browserLang.indexOf('tr') === 0) detected = 'tr';
                else if (browserLang.indexOf('it') === 0) detected = 'it';
                else if (browserLang.indexOf('es') === 0) detected = 'es';
                else if (browserLang.indexOf('de') === 0) detected = 'de';
                else if (browserLang.indexOf('fr') === 0) detected = 'fr';
                else detected = 'en';
            }

            var guidePrefix = '/guides/';
            if (detected === 'tr') guidePrefix = '/tr/rehber/';
            else if (detected === 'it') guidePrefix = '/it/guides/';
            else if (detected === 'es') guidePrefix = '/es/guides/';
            else if (detected === 'de') guidePrefix = '/de/guides/';
            else if (detected === 'fr') guidePrefix = '/fr/guides/';

            if (cityId) {
                window.location.replace(guidePrefix + encodeURIComponent(cityId) + ".html");
            } else {
                window.location.replace(guidePrefix);
            }
        })();
    </script>
</head>
<body style="margin:0;background:#0F0B1A;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;">
    <p>Loading city guide...</p>
</body>
</html>
