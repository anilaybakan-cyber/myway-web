<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyWay Travel Guide</title>
    <script>
        (function() {
            var pathParts = window.location.pathname.split("/").filter(Boolean);
            var filtered = pathParts.filter(function(p) {
                return p !== "guide" && p !== "guides" && p !== "index.html";
            });
            var params = new URLSearchParams(window.location.search);
            var cityId = (params.get("cityId") || filtered[filtered.length - 1] || "").toLowerCase();

            // Language detection
            var userChoice = localStorage.getItem('myway_user_lang');
            var isTr = userChoice === 'tr' || (!userChoice && (navigator.language || '').toLowerCase().indexOf('tr') === 0);

            if (cityId) {
                var target = isTr ? "/tr/rehber/" + encodeURIComponent(cityId) + ".html" : "/guides/" + encodeURIComponent(cityId) + ".html";
                window.location.replace(target);
            } else {
                window.location.replace(isTr ? "/tr/rehber/" : "/guides/");
            }
        })();
    </script>
</head>
<body style="margin:0;background:#0F0B1A;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;">
    <p>Loading city guide...</p>
</body>
</html>
