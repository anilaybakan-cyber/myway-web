<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Way - Open in App</title>

    <!-- Smart App Banner for iOS -->
    <meta name="apple-itunes-app" content="app-id=6741743515">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 400px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #D4A574;
        }

        p {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            padding: 16px 32px;
            background: #D4A574;
            color: #1a1a2e;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s;
        }

        .button:hover {
            transform: scale(1.05);
        }

        .sub-link {
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }

        .sub-link a {
            color: #D4A574;
            text-decoration: none;
        }
    </style>

    <script>
        // Get place and city from URL query parameters
        const params = new URLSearchParams(window.location.search);
        const placeName = params.get('id') || '';
        const city = params.get('city') || '';

        // Also check path format: /place/PlaceName
        const path = window.location.pathname;
        let pathPlaceName = '';
        const match = path.match(/\/place\/(.+)/);
        if (match) {
            pathPlaceName = decodeURIComponent(match[1]);
        }

        // Use query param if available, otherwise path
        const finalPlaceName = placeName || pathPlaceName;

        if (finalPlaceName) {
            // Build custom scheme URL (matches what the app expects)
            const customSchemeUrl = `mywayapp://place?id=${encodeURIComponent(finalPlaceName)}&city=${encodeURIComponent(city)}`;

            // Immediately try to open the app
            window.location.href = customSchemeUrl;

            // If app doesn't open within 1.5 seconds, redirect to App Store
            setTimeout(function () {
                window.location.href = 'https://apps.apple.com/app/id6741743515';
            }, 1500);
        }
    </script>
</head>

<body>
    <div class="container">
        <div class="logo">🧭</div>
        <h1>My Way Travel</h1>
        <p>Opening this place in My Way app...</p>
        <a href="https://apps.apple.com/app/id6741743515" class="button">
            Download My Way
        </a>
        <div class="sub-link">
            <a href="/">Visit our website</a>
        </div>
    </div>
</body>

</html>
